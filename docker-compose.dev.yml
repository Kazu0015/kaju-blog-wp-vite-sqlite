services:
  wordpress:
    build: .
    platform: linux/amd64
    restart: always
    depends_on:
      - vite
    ports:
      - "8080:80"
    volumes:
      - ./wordpress:/var/www/html
    environment:
      # ブラウザは localhost:5173、WP コンテナ内の死活確認は vite サービス名
      WORDPRESS_CONFIG_EXTRA: |
        define( 'KAJU_BLOG_VITE_STRATEGY', 'dev' );
        define( 'KAJU_BLOG_VITE_INTERNAL_ORIGIN', 'http://vite:5173' );
        defined( 'WP_HOME' )    || define( 'WP_HOME',    'http://localhost:8080' );
        defined( 'WP_SITEURL' ) || define( 'WP_SITEURL', 'http://localhost:8080' );

  vite:
    image: node:20-alpine
    working_dir: /repo/frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/repo
      - kaju_blog_vite_node_modules:/repo/frontend/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "1"
    command: sh -c "npm install && exec npm run dev -- --host 0.0.0.0"

volumes:
  kaju_blog_vite_node_modules:
